AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Delphinium Prospectus — Go API + static frontend

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: provided.al2023
    Architectures: [x86_64]
    Environment:
      Variables:
        QUOTES_TABLE: !Ref QuotesTable
        PDF_BUCKET: !Ref PdfBucket
        WEB_BASE_URL: !Sub 'https://${CloudFrontDistribution.DomainName}'
        PROSPECTUS_BASE_URL: !Sub 'https://${CloudFrontDistribution.DomainName}'
        ZOHO_CLIENT_ID: !Ref ZohoClientId
        ZOHO_CLIENT_SECRET: !Ref ZohoClientSecret
        ZOHO_REFRESH_TOKEN: !Ref ZohoRefreshToken
        ZOHO_ACCOUNTS_URL: !Ref ZohoAccountsUrl
        ZOHO_API_DOMAIN: !Ref ZohoApiDomain
        SLACK_BOT_TOKEN: !Ref SlackBotToken
        SLACK_QUOTES_CHANNEL: !Ref SlackQuotesChannel
        API_PASSWORD: !Ref ApiPassword
        ADMIN_PASSWORD: !Ref AdminPassword
        SALES_READ_TOKEN: !Ref SalesReadToken
        CONFIG_TABLE: !Ref ConfigTable

Parameters:
  ZohoClientId:
    Type: String
    Default: ''
    NoEcho: true
    Description: Zoho OAuth client id. Scopes ZohoCRM.modules.accounts.READ and ZohoCRM.modules.accounts.UPDATE.
  ZohoClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  ZohoRefreshToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Zoho refresh token. Leave empty until provided; the API does not call Zoho without it.
  ZohoAccountsUrl:
    Type: String
    Default: 'https://accounts.zoho.com'
  ZohoApiDomain:
    Type: String
    Default: 'https://www.zohoapis.com'
  SlackBotToken:
    Type: String
    Default: ''
    NoEcho: true
  SlackQuotesChannel:
    Type: String
    Default: ''
  ApiPassword:
    Type: String
    Default: 'delphinium'
    NoEcho: true
    Description: Shared password for mutating/list API routes (GET /quotes/{id} is public for shared links)
  AdminPassword:
    Type: String
    Default: 'delphiniumadmin'
    NoEcho: true
    Description: Admin password for pricing/SMS config settings
  SalesReadToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Revocable machine read-only token for Sales assistants (GET /quotes, /quotes/search, /quotes/{id} only). Prefer SSM /delphinium/prospectus/sales-read-token as source of truth.

Resources:
  QuotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: delphinium-quotes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quoteId
          AttributeType: S
      KeySchema:
        - AttributeName: quoteId
          KeyType: HASH

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: delphinium-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  PdfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: prospectus-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  ProspectusApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, X-Api-Key]

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: bootstrap
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuotesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - S3CrudPolicy:
            BucketName: !Ref PdfBucket
      Events:
        GetAuthSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /auth/session
            Method: GET
        GetConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /config
            Method: GET
        PutConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /config
            Method: PUT
        PostQuotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes
            Method: POST
        GetQuotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes
            Method: GET
        GetQuotesSearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/search
            Method: GET
        PostPreview:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/preview
            Method: POST
        PostFormLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/form-link
            Method: POST
        GetQuoteById:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/{id}
            Method: GET
        PatchQuote:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/{id}
            Method: PATCH
        DeleteQuote:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/{id}
            Method: DELETE
        PostPdf:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/{id}/pdf
            Method: POST
        PostNotify:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /quotes/{id}/notify
            Method: POST
        GetZohoAccounts:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /zoho/accounts
            Method: GET
        GetZohoAccountById:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /zoho/accounts/{id}
            Method: GET
        OptionsCatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProspectusApi
            Path: /{proxy+}
            Method: OPTIONS

Outputs:
  ApiUrl:
    Value: !Sub 'https://${ProspectusApi}.execute-api.${AWS::Region}.amazonaws.com'
  CloudFrontUrl:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  QuotesTableName:
    Value: !Ref QuotesTable
  ConfigTableName:
    Value: !Ref ConfigTable
  PdfBucketName:
    Value: !Ref PdfBucket
